<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notifications — Sheria Yangu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<style>
  .notif-body .notif-card {
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .notif-body .notif-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .notif-body .notif-title { font-weight: 600; font-size: 14px; }
  .notif-body .notif-new-tag {
    background: var(--red);
    color: white;
    font-size: 10px;
    font-weight: 700;
    border-radius: 6px;
    padding: 2px 6px;
    white-space: nowrap;
  }
  .notif-body .notif-meta { font-size: 12px; color: var(--ink-muted); margin-top: 4px; }
  .notif-body .notif-empty { color: var(--ink-muted); font-size: 13px; text-align: center; margin-top: 40px; }
</style>
</head>
<body>

<div class="phone">
  <header class="app-header">
    <button class="back" onclick="history.back()">←</button>
    <span>Notifications</span>
    <span style="width:18px;"></span>
  </header>
  <div class="screen-body notif-body">
    <p class="subtitle">Bills currently open for public participation.</p>
    <div id="notif-list"></div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  if (SY.requireSignIn()) { SY.injectNav('notifications'); }

  function openBill(billId) {
    SY.setBillId(billId);
    window.location.href = 'bill-detail.html';
  }

  SY.apiFetch('/api/bills/open', {}, { redirectOn401: false })
    .then(res => res.json())
    .then(bills => {
      const list = document.getElementById('notif-list');
      if (!Array.isArray(bills) || bills.length === 0) {
        list.innerHTML = '<div class="notif-empty">No bills are currently open for public participation.</div>';
        return;
      }

      const seen = new Set(SY.getSeenBillIds());

      list.innerHTML = bills.map(b => {
        const isNew = !seen.has(b.id);
        const closes = b.closes_at ? new Date(b.closes_at).toLocaleDateString() : 'unknown';
        return `
          <div class="notif-card" onclick="openBill('${b.id}')">
            <div class="notif-top">
              <span class="notif-title">${b.title || 'Untitled bill'}</span>
              ${isNew ? '<span class="notif-new-tag">New</span>' : ''}
            </div>
            <div class="notif-meta">${b.level || ''} ${b.year || ''} — open for comment, closes ${closes}</div>
          </div>
        `;
      }).join('');

      // Mark everything shown as seen so the "New" tag doesn't reappear.
      SY.markBillsSeen(bills.map(b => b.id));
    })
    .catch(() => {
      document.getElementById('notif-list').innerHTML =
        '<div class="notif-empty">Couldn\'t load notifications right now.</div>';
    });
</script>
</body>
</html>
