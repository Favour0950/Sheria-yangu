<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your memorandum — Sheria Yangu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="phone">
  <header class="app-header">
    <button class="back" onclick="history.back()">←</button>
    <span>Your memorandum</span>
    <span style="width:18px;"></span>
  </header>
  <div class="screen-body">
    <div id="error-box" class="error-box"></div>
    <p class="status-line" id="memo-status">Drafting your memorandum…</p>
    <textarea id="memo-text"></textarea>
    <p class="status-line" id="recipient-line" style="display:none;"></p>
    <button class="primary" id="send-btn" onclick="sendMemo()" disabled>Tuma kwa Bunge (Send) →</button>
    <div class="disclosure-note" id="fallback-note" style="display:none;">
      Nothing happened when you clicked Send? Your device likely has no default
      email app set up — this is a device setting, not something the app can
      fix. Use the buttons below instead:
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="secondary" style="margin-top:0;" onclick="copyText()">Copy memorandum text</button>
        <button class="secondary" style="margin-top:0;" onclick="copyRecipient()">Copy email address</button>
      </div>
      <span id="copy-confirm" style="color:var(--green); display:none;"></span>
    </div>
    <button class="secondary" onclick="window.location.href='bill-detail.html'">Done — back to Bills</button>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  const errorBox = document.getElementById('error-box');
  const statusEl = document.getElementById('memo-status');
  const textEl = document.getElementById('memo-text');
  const sendBtn = document.getElementById('send-btn');

  const billId = new URLSearchParams(window.location.search).get('id') || SY.getBillId();
  let memorandumId = null;
  let billLevel = null;

  // Same fix as clauses.html: only call draftMemo() once every const/let
  // above is actually assigned. Calling it earlier throws a "Cannot access
  // 'billId'/'errorBox' before initialization" TDZ error the instant
  // draftMemo's first synchronous line runs, which — because draftMemo is
  // async — becomes a silent unhandled rejection instead of a visible error,
  // leaving this screen stuck on "Drafting your memorandum…" forever.
  if (SY.requireSignIn()) { draftMemo(); SY.injectNav('bills'); }

  async function draftMemo() {
    const consents = JSON.parse(sessionStorage.getItem('sy_consents') || 'null');
    const votes = SY.getVotes();
    const rejectedIds = Object.keys(votes).filter(id => votes[id] === 'kataa');

    if (!consents || rejectedIds.length === 0) {
      statusEl.textContent = '';
      SY.showError(errorBox, 'Missing consent or no rejected clauses — go back and complete those steps first.');
      sendBtn.disabled = true;
      return;
    }

    try {
      // Bill level (county vs national) decides where this memorandum is
      // addressed on send — fetch it now so sendMemo() below doesn't need a
      // second round trip.
      const billRes = await SY.apiFetch('/api/bill?id=' + encodeURIComponent(billId), {}, { redirectOn401: false });
      const bill = await billRes.json();
      billLevel = bill.level;

      const res = await SY.apiFetch('/api/memoranda', {
        method: 'POST',
        body: JSON.stringify(Object.assign({ bill_id: billId, rejected_clause_ids: rejectedIds }, consents)),
      });
      const data = await res.json();
      if (!res.ok) {
        statusEl.textContent = '';
        SY.showError(errorBox, data.error || 'Could not draft the memorandum.');
        return;
      }
      memorandumId = data.memorandum_id;
      // The draft already ends with a "Sincerely, [Your name]" placeholder
      // (see main.py's create_memorandum) — real names on memoranda make
      // Parliament far less likely to dismiss them as spam. This line makes
      // sure that's not missed rather than relying on people to notice it
      // themselves inside the textarea.
      statusEl.textContent = 'Draft ready — replace [Your name] at the end with your actual name, edit anything else, then send:';
      textEl.value = data.draft_text;
      sendBtn.disabled = false;

      // Show who this is actually addressed to, and reveal the copy/paste
      // fallback up front rather than only after a failed send — there's no
      // reliable way for JS to detect whether a mailto: link actually opened
      // anything (browsers don't fire an error event for a missing/unset
      // default mail app), so we can't wait to "detect" failure.
      const recipient = billLevel === 'county' ? 'clerk@nairobiassembly.go.ke' : 'cna@parliament.go.ke';
      const recipientLine = document.getElementById('recipient-line');
      recipientLine.textContent = 'Addressed to: ' + recipient;
      recipientLine.style.display = 'block';
      document.getElementById('fallback-note').style.display = 'block';
    } catch (e) {
      statusEl.textContent = '';
      SY.showError(errorBox, 'Could not reach the server to draft the memorandum.');
    }
  }

  async function sendMemo() {
    // Disable immediately — before, a fast double-click (or an impatient
    // re-click while waiting for mark-sent to round-trip) could fire the
    // mark-sent request twice. memorandumId only ever refers to the ONE
    // memorandum already created back in draftMemo(), so re-sending never
    // creates a duplicate row either way, but there's no reason to fire the
    // request twice or let the button look clickable while it's mid-flight.
    sendBtn.disabled = true;
    const originalLabel = sendBtn.textContent;
    sendBtn.textContent = 'Opening email…';

    const editedText = textEl.value;
    const body = encodeURIComponent(editedText);
    const subject = encodeURIComponent('Public Participation Memorandum');

    // Routing depends on which body the bill originated in — these are NOT
    // interchangeable (see docs/BUILD_CHECKLIST.md's email-routing note):
    //   county bill    -> clerk@nairobiassembly.go.ke (Nairobi City County Assembly)
    //   national bill  -> cna@parliament.go.ke (National Assembly clerk)
    // Only two levels are tracked today (national/county), not which House a
    // national bill is from, so national defaults to the National Assembly
    // address as the more common case for this app's current bill mix.
    const recipient = billLevel === 'county' ? 'clerk@nairobiassembly.go.ke' : 'cna@parliament.go.ke';

    if (memorandumId) {
      try {
        await SY.apiFetch(`/api/memoranda/${memorandumId}/mark-sent`, {
          method: 'POST',
          body: JSON.stringify({ edited_text: editedText }),
        });
      } catch (e) {
        // Non-fatal — the mailto: below still opens either way; the record
        // just won't show as "sent" if this write failed.
      }
    }
    // Attempt the mailto: link — this only does anything visible if the
    // user's OS/browser has a default mail app registered (desktop Outlook,
    // Mail.app, Thunderbird, or a browser explicitly set up to hand mailto:
    // links to Gmail/Outlook web). Most people using only web-based email
    // have nothing registered, so this silently does nothing for them — that
    // is a real, well-known limitation of the mailto: protocol itself, not a
    // bug in this code. The copy/paste fallback below (always visible once a
    // draft exists — see draftMemo()) is what those users actually rely on.
    window.location.href = `mailto:${recipient}?subject=${subject}&body=${body}`;

    // Re-enable after a short pause rather than leaving it disabled forever —
    // there's no reliable way to detect whether the mailto: link actually
    // opened anything, so the button needs to become clickable again in case
    // nothing happened and the person wants to try again (or use the copy
    // fallback instead). The pause is just long enough to absorb an
    // accidental double-click, not a real loading state with a known end.
    setTimeout(() => {
      sendBtn.disabled = false;
      sendBtn.textContent = originalLabel;
    }, 1500);
  }

  async function copyText() {
    try {
      await navigator.clipboard.writeText(textEl.value);
      flashCopyConfirm('Memorandum text copied.');
    } catch (e) {
      flashCopyConfirm('Could not copy automatically — select the text above and copy it manually.');
    }
  }

  async function copyRecipient() {
    const recipient = billLevel === 'county' ? 'clerk@nairobiassembly.go.ke' : 'cna@parliament.go.ke';
    try {
      await navigator.clipboard.writeText(recipient);
      flashCopyConfirm('Address copied: ' + recipient);
    } catch (e) {
      flashCopyConfirm('Could not copy automatically — the address is: ' + recipient);
    }
  }

  function flashCopyConfirm(message) {
    const el = document.getElementById('copy-confirm');
    el.textContent = message;
    el.style.display = 'inline';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
  }
</script>
</body>
</html>
