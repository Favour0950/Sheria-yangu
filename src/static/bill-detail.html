<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bills — Sheria Yangu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="phone">
  <header class="app-header">
    <button class="back" onclick="history.back()">←</button>
    <span>Open for participation</span>
    <span style="width:18px;"></span>
  </header>
  <div class="screen-body">
    <div id="error-box" class="error-box"></div>
    <p class="status-line" id="status-line">Loading bills…</p>
    <div id="bill-list"></div>
  </div>

  <div class="sy-footer">© Sheria Yangu 2026</div>
</div>

<script src="js/app.js"></script>
<script>
  if (SY.requireSignIn()) { loadBills(); SY.injectNav('bills'); }

  const errorBox = document.getElementById('error-box');
  const statusLine = document.getElementById('status-line');
  const listEl = document.getElementById('bill-list');

  async function loadBills() {
    try {
      // /api/bills/open is the ONLY source this screen trusts (see main.py's
      // list_open_bills docstring) — a bill that's scraped but not yet
      // published open by an admin, or whose window has already closed, must
      // never reach a real citizen here. No fallback to the general /api/bills
      // listing on purpose: an unreviewed bill being visible to the public
      // was a real gap, not a feature, and admin.html's Bills tab is where
      // pending bills belong until an admin explicitly publishes them.
      let res = await SY.apiFetch('/api/bills/open', {}, { redirectOn401: false });
      let bills = await res.json();

      if (!Array.isArray(bills) || bills.length === 0) {
        statusLine.textContent = '';
        listEl.innerHTML = '<div class="empty-state">No bills are currently open for public participation. ' +
          'Check back soon.</div>';
        return;
      }

      statusLine.textContent = `${bills.length} bill(s) confirmed open for public participation.`;

      listEl.innerHTML = '';
      bills.forEach(bill => {
        const div = document.createElement('div');
        div.className = 'card';
        const levelClass = bill.level === 'county' ? 'level-county' : 'level-national';
        div.innerHTML = `
          <span class="tag ${levelClass}">${bill.level || 'unknown level'}${bill.year ? ' · ' + bill.year : ''}</span>
          <h3>${bill.title || 'Untitled bill'}</h3>
          <p>${bill.clause_count || 0} clause(s) scraped</p>
          <button class="primary" style="margin-top:10px;" onclick="selectBill('${bill.id}')">View this bill →</button>
        `;
        listEl.appendChild(div);
      });
    } catch (e) {
      SY.showError(errorBox, 'Could not load bills — check the server is running.');
    }
  }

  function selectBill(billId) {
    SY.setBillId(billId);
    window.location.href = 'bill-choice.html?id=' + encodeURIComponent(billId);
  }
</script>
</body>
</html>
