<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bill detail — Sheria Yangu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="phone">
  <header class="app-header">
    <button class="back" onclick="window.location.href='bill-detail.html'">←</button>
    <span>Bill detail</span>
    <span style="width:18px;"></span>
  </header>
  <div class="screen-body">
    <div id="error-box" class="error-box"></div>
    <div id="bill-detail"><p class="status-line">Loading…</p></div>

    <button class="primary" id="read-btn" onclick="readSummary()">Read plain-language summary & vote →</button>
    <button class="secondary" id="source-btn" onclick="viewSource()">View original bill text ↗</button>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  if (SY.requireSignIn()) { loadBill(); SY.injectNav('bills'); }

  const errorBox = document.getElementById('error-box');
  const detailEl = document.getElementById('bill-detail');
  let currentBill = null;

  function billIdFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get('id') || SY.getBillId();
  }

  async function loadBill() {
    const billId = billIdFromUrl();
    if (!billId) {
      window.location.href = 'bill-detail.html';
      return;
    }
    SY.setBillId(billId);
    try {
      const res = await SY.apiFetch('/api/bill?id=' + encodeURIComponent(billId), {}, { redirectOn401: false });
      const bill = await res.json();
      if (!res.ok) {
        SY.showError(errorBox, bill.error || 'Bill not found.');
        detailEl.innerHTML = '';
        document.getElementById('read-btn').disabled = true;
        document.getElementById('source-btn').disabled = true;
        return;
      }
      currentBill = bill;
      const levelClass = bill.level === 'county' ? 'level-county' : 'level-national';
      detailEl.innerHTML = `
        <span class="tag ${levelClass}">${bill.level || 'unknown level'}${bill.year ? ' · ' + bill.year : ''}</span>
        <h2 class="title">${bill.title || 'Untitled bill'}</h2>
        <p class="status-line">
          ${SY.friendlyStatus(bill.status)}
          ${bill.opens_at ? ' · Opens: ' + bill.opens_at : ''}
          ${bill.closes_at ? ' · Closes: ' + bill.closes_at : ''}
        </p>
        <p class="subtitle">${(bill.clauses || []).length} clause(s) available in plain English + Kiswahili.</p>
      `;
      if (!bill.source_url) document.getElementById('source-btn').disabled = true;
    } catch (e) {
      SY.showError(errorBox, 'Could not load this bill — check the server is running.');
    }
  }

  function readSummary() {
    const billId = billIdFromUrl();
    window.location.href = 'clauses.html?id=' + encodeURIComponent(billId);
  }

  function viewSource() {
    if (currentBill && currentBill.source_url) {
      window.open(currentBill.source_url, '_blank', 'noopener');
    }
  }
</script>
</body>
</html>
