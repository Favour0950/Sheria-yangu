<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign in — Sheria Yangu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="phone">
  <header class="app-header">
    <button class="back" onclick="window.location.href='splash.html'">←</button>
    <span>Sign in</span>
    <span style="width:18px;"></span>
  </header>
  <div class="screen-body">
    <h2 class="title">Enter your phone number</h2>
    <p class="subtitle">We'll text you a 6-digit code. Your number is never stored —
       only a one-way hash of it, so no one (including us) can look up who you are
       from it. See how in our Terms.</p>

    <div id="error-box" class="error-box"></div>

    <label for="phone">Phone number</label>
    <input type="tel" id="phone" placeholder="+2547XXXXXXXX" autocomplete="tel">

    <label for="constituency">Constituency <span style="font-weight:400;color:var(--ink-muted);">(optional, self-reported)</span></label>
    <input type="text" id="constituency" placeholder="e.g. Kibra">

    <button class="primary" id="send-btn" onclick="sendCode()">Send code →</button>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  const errorBox = document.getElementById('error-box');

  async function sendCode() {
    SY.hideError(errorBox);
    const phone = document.getElementById('phone').value.trim();
    const constituency = document.getElementById('constituency').value.trim();
    if (!phone) {
      SY.showError(errorBox, 'Enter a phone number first.');
      return;
    }
    const btn = document.getElementById('send-btn');
    btn.disabled = true;
    btn.textContent = 'Sending…';
    try {
      const res = await SY.apiFetch('/api/auth/request-otp', {
        method: 'POST',
        body: JSON.stringify({ phone_number: phone, constituency: constituency || undefined }),
      }, { redirectOn401: false });
      const data = await res.json();
      if (!res.ok) {
        SY.showError(errorBox, data.error || 'Could not send code — try again.');
        return;
      }
      SY.setPhone(phone);
      // SMS_DEV_MODE returns the code directly for local testing without real SMS —
      // stash it so otp.html can pre-fill it and make dev testing one less step.
      if (data.dev_otp_code) {
        sessionStorage.setItem('sy_dev_otp_code', data.dev_otp_code);
      }
      window.location.href = 'otp.html';
    } catch (e) {
      SY.showError(errorBox, 'Network error — check the server is running and try again.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send code →';
    }
  }
</script>
</body>
</html>
