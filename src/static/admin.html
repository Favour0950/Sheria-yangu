<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sheria Yangu — Admin Review</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* Admin-specific layout only — colors/fonts inherited from style.css */
    .admin-wrap { max-width: 700px; margin: 0 auto; padding: 24px 16px; }
    .admin-login-box { max-width: 360px; margin: 80px auto; }
    .admin-login-box input {
      width: 100%; padding: 10px; margin-bottom: 12px;
      border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box;
    }
    .review-card {
      border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin-bottom: 20px;
    }
    .review-card h4 { margin: 0 0 8px; }
    .review-card .raw-text {
      font-size: 0.85em; color: #555; background: #f7f7f7;
      padding: 8px; border-radius: 6px; margin-bottom: 10px; white-space: pre-wrap;
    }
    .review-card .summary-block { margin-bottom: 10px; }
    .review-card .summary-block textarea {
      width: 100%; min-height: 70px; box-sizing: border-box;
      padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-family: inherit;
    }
    .review-actions { display: flex; gap: 8px; margin-top: 10px; }
    .review-actions button {
      padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600;
    }
    .btn-approve { background: #2e7d32; color: white; }
    .btn-edit { background: #f9a825; color: white; }
    .btn-reject { background: #c62828; color: white; }
    .btn-save-edit { background: #1565c0; color: white; }
    .empty-state { text-align: center; color: #777; padding: 40px 0; }
    #admin-error { color: #c62828; margin-top: 8px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .admin-header button { background: none; border: 1px solid #ccc; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
    .admin-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .admin-tabs button {
      flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc;
      background: #f2f2f2; cursor: pointer; font-weight: 600;
    }
    .admin-tabs button.active { background: #2e7d32; color: white; border-color: #2e7d32; }
    .bill-card {
      border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin-bottom: 16px;
    }
    .bill-card h4 { margin: 0 0 6px; }
    .bill-status {
      display: inline-block; font-size: 0.8em; font-weight: 600; border-radius: 6px;
      padding: 2px 8px; margin-bottom: 10px;
    }
    .bill-status.open { background: #e6f4ea; color: #2e7d32; }
    .bill-status.needs_manual_review { background: #fff4e0; color: #b5750a; }
    .publish-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-top: 8px; }
    .publish-row div { display: flex; flex-direction: column; font-size: 0.8em; }
    .publish-row input { padding: 6px; border-radius: 6px; border: 1px solid #ccc; }
    .publish-row button {
      padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer;
      font-weight: 600; background: #1565c0; color: white; height: 34px;
    }
    .open-dates { font-size: 0.85em; color: #555; }
    #bills-error { color: #c62828; font-size: 0.85em; margin-top: 6px; }
  </style>
</head>
<body>

  <!-- Login screen -->
  <div id="login-screen" class="admin-wrap admin-login-box">
    <h2>Sheria Yangu — Admin</h2>
    <p>Enter the admin password to review pending AI summaries.</p>
    <input type="password" id="admin-password" placeholder="Admin password" />
    <button onclick="adminLogin()">Log In</button>
    <div id="admin-error"></div>
  </div>

  <!-- Review queue screen (hidden until logged in) -->
  <div id="review-screen" class="admin-wrap" style="display:none;">
    <div class="admin-header">
      <h2 id="screen-title">Pending Summary Reviews</h2>
      <button onclick="adminLogout()">Log Out</button>
    </div>
    <div class="admin-tabs">
      <button id="tab-summaries" class="active" onclick="switchTab('summaries')">Summary Reviews</button>
      <button id="tab-bills" onclick="switchTab('bills')">Bills (Open/Closed)</button>
    </div>
    <div id="review-list"></div>
    <div id="bills-list" style="display:none;"></div>
    <div id="bills-error"></div>
  </div>

  <script>
    const TOKEN_KEY = 'sy_admin_token';

    function getToken() {
      return localStorage.getItem(TOKEN_KEY);
    }

    function showLogin() {
      document.getElementById('login-screen').style.display = 'block';
      document.getElementById('review-screen').style.display = 'none';
    }

    function showReview() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('review-screen').style.display = 'block';
      loadPending();
    }

    function switchTab(tab) {
      const summariesTab = document.getElementById('tab-summaries');
      const billsTab = document.getElementById('tab-bills');
      const reviewList = document.getElementById('review-list');
      const billsList = document.getElementById('bills-list');
      const title = document.getElementById('screen-title');
      if (tab === 'bills') {
        summariesTab.classList.remove('active');
        billsTab.classList.add('active');
        reviewList.style.display = 'none';
        billsList.style.display = 'block';
        title.textContent = 'Bills — Open/Closed Status';
        loadBills();
      } else {
        billsTab.classList.remove('active');
        summariesTab.classList.add('active');
        billsList.style.display = 'none';
        reviewList.style.display = 'block';
        title.textContent = 'Pending Summary Reviews';
      }
    }

    async function adminLogin() {
      const password = document.getElementById('admin-password').value;
      const errorBox = document.getElementById('admin-error');
      errorBox.textContent = '';
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        const data = await res.json();
        if (!res.ok) {
          errorBox.textContent = data.error || 'Login failed';
          return;
        }
        localStorage.setItem(TOKEN_KEY, data.access_token);
        showReview();
      } catch (e) {
        errorBox.textContent = 'Could not reach the server.';
      }
    }

    function adminLogout() {
      localStorage.removeItem(TOKEN_KEY);
      showLogin();
    }

    async function loadPending() {
      const list = document.getElementById('review-list');
      list.innerHTML = '<p>Loading…</p>';
      try {
        const res = await fetch('/api/admin/summaries/pending', {
          headers: { 'Authorization': 'Bearer ' + getToken() },
        });
        if (res.status === 401 || res.status === 403) {
          adminLogout();
          return;
        }
        const items = await res.json();
        renderPending(items);
      } catch (e) {
        list.innerHTML = '<p class="empty-state">Could not load pending summaries.</p>';
      }
    }

    function renderPending(items) {
      const list = document.getElementById('review-list');
      list.innerHTML = '';
      if (items.length === 0) {
        list.innerHTML = '<div class="empty-state">Nothing pending — all caught up.</div>';
        return;
      }
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'review-card';
        card.id = `card-${item.bill_id}-${item.clause_id}`;
        const sourceLink = item.source_url
          ? `<a href="${escapeHtml(item.source_url)}" target="_blank" rel="noopener" style="font-size:0.85em;">View original bill PDF →</a>`
          : `<span style="font-size:0.85em;color:#999;">No source PDF link on file</span>`;
        card.innerHTML = `
          <h4>${item.bill_title} — Clause ${item.clause_number || item.clause_id}</h4>
          <div style="margin-bottom:8px;">${sourceLink}</div>
          <div class="raw-text">${escapeHtml(item.raw_text)}</div>
          <div class="summary-block">
            <strong>English:</strong>
            <textarea id="en-${item.bill_id}-${item.clause_id}">${escapeHtml(item.summary_en)}</textarea>
          </div>
          <div class="summary-block">
            <strong>Kiswahili:</strong>
            <textarea id="sw-${item.bill_id}-${item.clause_id}">${escapeHtml(item.summary_sw)}</textarea>
          </div>
          <div class="review-actions">
            <button class="btn-approve" onclick="reviewClause('${item.bill_id}','${item.clause_id}','approve')">✓ Approve</button>
            <button class="btn-save-edit" onclick="reviewClause('${item.bill_id}','${item.clause_id}','edit')">💾 Save Edit</button>
            <button class="btn-reject" onclick="reviewClause('${item.bill_id}','${item.clause_id}','reject')">✗ Reject</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    async function reviewClause(billId, clauseId, decision) {
      const body = { decision };
      if (decision === 'edit') {
        body.corrected_summary_en = document.getElementById(`en-${billId}-${clauseId}`).value;
        body.corrected_summary_sw = document.getElementById(`sw-${billId}-${clauseId}`).value;
      }
      try {
        const res = await fetch(`/api/admin/summaries/${encodeURIComponent(billId)}/${encodeURIComponent(clauseId)}/review`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + getToken(),
          },
          body: JSON.stringify(body),
        });
        if (res.status === 401 || res.status === 403) {
          adminLogout();
          return;
        }
        if (!res.ok) {
          alert('Something went wrong — try again.');
          return;
        }
        const card = document.getElementById(`card-${billId}-${clauseId}`);
        if (card) card.remove();
        const list = document.getElementById('review-list');
        if (list.children.length === 0) {
          list.innerHTML = '<div class="empty-state">Nothing pending — all caught up.</div>';
        }
      } catch (e) {
        alert('Could not reach the server.');
      }
    }

    async function loadBills() {
      const list = document.getElementById('bills-list');
      const errorBox = document.getElementById('bills-error');
      errorBox.textContent = '';
      list.innerHTML = '<p>Loading…</p>';
      try {
        // /api/bills is public (no admin token needed) and returns every
        // scraped bill regardless of status, unlike /api/bills/open.
        const res = await fetch('/api/bills');
        const items = await res.json();
        renderBills(items);
      } catch (e) {
        list.innerHTML = '<p class="empty-state">Could not load bills.</p>';
      }
    }

    function renderBills(items) {
      const list = document.getElementById('bills-list');
      list.innerHTML = '';
      if (items.length === 0) {
        list.innerHTML = '<div class="empty-state">No scraped bills yet.</div>';
        return;
      }
      items.forEach(bill => {
        const card = document.createElement('div');
        card.className = 'bill-card';
        card.id = `bill-${bill.id}`;
        const statusClass = bill.status === 'open' ? 'open' : 'needs_manual_review';
        const statusLabel = bill.status === 'open' ? 'Open' : 'Needs manual review';
        let bodyHtml = `
          <h4>${escapeHtml(bill.title || bill.id)}</h4>
          <span class="bill-status ${statusClass}">${statusLabel}</span>
        `;
        if (bill.status === 'open') {
          bodyHtml += `
            <div class="open-dates">Open ${escapeHtml(bill.opens_at || '?')} → ${escapeHtml(bill.closes_at || '?')}</div>
            <div class="publish-row">
              <div>
                <label>New opens</label>
                <input type="date" id="opens-${bill.id}" value="${escapeHtml(bill.opens_at || '')}" />
              </div>
              <div>
                <label>New closes</label>
                <input type="date" id="closes-${bill.id}" value="${escapeHtml(bill.closes_at || '')}" />
              </div>
              <button onclick="publishBill('${bill.id}')">Update dates</button>
            </div>
          `;
        } else {
          bodyHtml += `
            <div style="margin-bottom:8px;">
              <button onclick="generateSummaries('${bill.id}')" style="padding:6px 12px;border-radius:6px;border:1px solid #ccc;background:#f2f2f2;cursor:pointer;">
                Generate summaries for review
              </button>
              <span id="gen-status-${bill.id}" style="font-size:0.8em;color:#555;margin-left:8px;"></span>
            </div>
            <div class="publish-row">
              <div>
                <label>Opens at</label>
                <input type="date" id="opens-${bill.id}" />
              </div>
              <div>
                <label>Closes at</label>
                <input type="date" id="closes-${bill.id}" />
              </div>
              <button onclick="publishBill('${bill.id}')">Publish as open</button>
            </div>
            <div id="publish-error-${bill.id}" style="color:#c62828;font-size:0.8em;margin-top:6px;"></div>
          `;
        }
        card.innerHTML = bodyHtml;
        list.appendChild(card);
      });
    }

    async function generateSummaries(billId) {
      const statusEl = document.getElementById(`gen-status-${billId}`);
      statusEl.textContent = 'Generating… this can take a while for a bill with many clauses.';
      try {
        const res = await fetch(`/api/admin/bills/${encodeURIComponent(billId)}/generate-summaries`, {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + getToken() },
        });
        if (res.status === 401 || res.status === 403) {
          adminLogout();
          return;
        }
        const data = await res.json();
        if (!res.ok) {
          statusEl.textContent = data.error || 'Something went wrong.';
          return;
        }
        const failedNote = data.failed && data.failed.length ? `, ${data.failed.length} failed` : '';
        statusEl.textContent = `Generated ${data.generated}, skipped ${data.skipped}${failedNote}. ` +
          `Go review them in the Summary Reviews tab.`;
      } catch (e) {
        statusEl.textContent = 'Could not reach the server.';
      }
    }

    async function publishBill(billId) {
      const errorBox = document.getElementById('bills-error');
      const perBillError = document.getElementById(`publish-error-${billId}`);
      errorBox.textContent = '';
      if (perBillError) perBillError.textContent = '';
      const opensAt = document.getElementById(`opens-${billId}`).value;
      const closesAt = document.getElementById(`closes-${billId}`).value;
      if (!opensAt || !closesAt) {
        errorBox.textContent = 'Both dates are required — read the real dates off the county notice.';
        return;
      }
      try {
        const res = await fetch(`/api/admin/bills/${encodeURIComponent(billId)}/publish`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + getToken(),
          },
          body: JSON.stringify({ opens_at: opensAt, closes_at: closesAt }),
        });
        if (res.status === 401 || res.status === 403) {
          adminLogout();
          return;
        }
        const data = await res.json();
        if (!res.ok) {
          let msg = data.error || 'Something went wrong — try again.';
          if (data.unreviewed_clause_ids && data.unreviewed_clause_ids.length) {
            msg += ` (${data.unreviewed_clause_ids.length} clause(s) still pending: ${data.unreviewed_clause_ids.join(', ')})`;
          }
          if (perBillError) {
            perBillError.textContent = msg;
          } else {
            errorBox.textContent = msg;
          }
          return;
        }
        loadBills();
      } catch (e) {
        errorBox.textContent = 'Could not reach the server.';
      }
    }

    // On page load, check if already logged in
    if (getToken()) {
      showReview();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
