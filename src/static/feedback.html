<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Send feedback — Sheria Yangu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<style>
  .feedback-body textarea {
    width: 100%;
    min-height: 140px;
    font-size: 14px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink);
    resize: vertical;
    font-family: inherit;
    margin-bottom: 10px;
  }
  .feedback-body .to-line { font-size: 12px; color: var(--ink-muted); margin-bottom: 16px; }
  .feedback-body .to-line code { background: var(--tag-bg); padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>

<div class="phone">
  <header class="app-header">
    <button class="back" onclick="history.back()">←</button>
    <span>Send feedback</span>
    <span style="width:18px;"></span>
  </header>
  <div class="screen-body feedback-body">
    <p class="subtitle">
      Tell us what's working, what's confusing, or what's broken — this goes
      straight to the KamiLimu shortcode our team reads, not into a queue.
    </p>
    <label for="fb-text">Your message</label>
    <textarea id="fb-text" placeholder="Type your feedback or question here…"></textarea>
    <div class="to-line">Sends to <code>20880</code>, prefixed with <code>kamilimu sheriayangu</code></div>
    <button class="primary" onclick="sendFeedbackSms()">Send via SMS →</button>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  if (SY.requireSignIn()) { SY.injectNav('feedback'); }

  function sendFeedbackSms() {
    const text = document.getElementById('fb-text').value.trim();
    if (!text) return;
    const body = 'kamilimu sheriayangu ' + text;
    window.location.href = 'sms:20880?body=' + encodeURIComponent(body);
  }
</script>
</body>
</html>
