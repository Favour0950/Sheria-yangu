<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile — Sheria Yangu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="phone">
  <header class="app-header">
    <button class="back" onclick="history.back()">←</button>
    <span>Your profile</span>
    <span style="width:18px;"></span>
  </header>
  <div class="screen-body">
    <div id="error-box" class="error-box"></div>
    <p class="status-line" id="loading-line">Loading your data…</p>

    <div id="profile-content" style="display:none;">
      <h3 class="title" style="font-size:16px;">Constituency</h3>
      <p class="subtitle" id="constituency-line"></p>

      <h3 class="title" style="font-size:16px;">Your votes</h3>
      <div id="responses-list"></div>

      <h3 class="title" style="font-size:16px; margin-top:20px;">Your memoranda</h3>
      <div id="memoranda-list"></div>

      <div class="disclosure-note">
        This is everything Sheria Yangu has recorded against your account —
        nothing here is visible to anyone else, and county analytics never
        joins back to this data (see Terms & data policy).
      </div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  if (SY.requireSignIn()) { loadProfile(); SY.injectNav('profile'); }

  const errorBox = document.getElementById('error-box');

  async function loadProfile() {
    try {
      const [meRes, activityRes] = await Promise.all([
        SY.apiFetch('/api/me'),
        SY.apiFetch('/api/me/activity'),
      ]);
      const me = await meRes.json();
      const activity = await activityRes.json();

      if (!meRes.ok || !activityRes.ok) {
        SY.showError(errorBox, (me && me.error) || (activity && activity.error) || 'Could not load your profile.');
        document.getElementById('loading-line').textContent = '';
        return;
      }

      document.getElementById('constituency-line').textContent =
        me.constituency ? me.constituency + ' (self-reported)' : 'Not set — add one in Settings.';

      const responsesList = document.getElementById('responses-list');
      if (activity.responses.length === 0) {
        responsesList.innerHTML = '<p class="subtitle">You haven\'t voted on any clauses yet.</p>';
      } else {
        responsesList.innerHTML = activity.responses.map(r => `
          <div class="card">
            <p style="color:var(--ink); font-size:14px; margin-bottom:4px;">${r.bill_title}</p>
            <p>${r.vote === 'kubali' ? '✓ Kubali' : '✗ Kataa'} — clause ${r.clause_id}</p>
          </div>
        `).join('');
      }

      const memorandaList = document.getElementById('memoranda-list');
      if (activity.memoranda.length === 0) {
        memorandaList.innerHTML = '<p class="subtitle">You haven\'t drafted any memoranda yet.</p>';
      } else {
        memorandaList.innerHTML = activity.memoranda.map(m => `
          <div class="card">
            <p style="color:var(--ink); font-size:14px; margin-bottom:4px;">${m.bill_title}</p>
            <p>${m.status === 'sent' ? 'Sent' : 'Draft — not yet sent'}${m.sent_at ? ' · ' + m.sent_at : ''}</p>
          </div>
        `).join('');
      }

      document.getElementById('loading-line').style.display = 'none';
      document.getElementById('profile-content').style.display = 'block';
    } catch (e) {
      SY.showError(errorBox, 'Could not reach the server to load your profile.');
      document.getElementById('loading-line').textContent = '';
    }
  }
</script>
</body>
</html>
